# Blueprint Render pour RestoPilote (https://render.com)
# Déploie UNIQUEMENT le service web Node. La base PostgreSQL est externe
# (Neon / Supabase) car Render limite à une seule base gratuite par compte.
# La connexion se fait via la variable DATABASE_URL (à renseigner au déploiement).
# Utilisation : Render Dashboard → New → Blueprint → sélectionne ce dépôt.

services:
  - type: web
    name: restopilote
    runtime: node
    plan: free                 # gratuit (s'endort après ~15 min d'inactivité ; démarrage à froid)
    region: frankfurt          # Europe = le plus proche de Madagascar parmi les régions gratuites
    branch: main
    # --include=dev : installe esbuild/tailwind/typescript (devDeps) nécessaires au build.
    # db:push crée/synchronise les tables sur la base (vide au 1er déploiement).
    buildCommand: npm install --include=dev && npm run build && npm run db:push
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true    # Render génère un secret aléatoire sûr
      - key: ENABLE_TEST_LOGIN
        value: "false"         # pas d'accès test en production
      - key: GEMINI_API_KEY
        sync: false            # optionnel : à renseigner dans le dashboard (onglet Analyses IA)
      - key: DATABASE_URL
        sync: false            # OBLIGATOIRE : chaîne de connexion de la base externe (Neon/Supabase)
